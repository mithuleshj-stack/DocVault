<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0d9488" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="128" fill="url(#vaultGrad)" />

  <!-- Shield Base Contour -->
  <g filter="url(#glow)">
    <path d="M256 80 L380 130 C380 270 320 370 256 420 C192 370 132 270 132 130 Z" 
          fill="#0f172a" stroke="url(#goldAccent)" stroke-width="12" stroke-linejoin="round" />
  </g>

  <!-- Document Silhouette inside Shield -->
  <path d="M200 170 H290 L330 210 V330 C330 338 324 344 316 344 H200 C192 344 186 338 186 330 V184 C186 176 192 170 200 170 Z" 
        fill="#1e293b" stroke="#5eead4" stroke-width="6" stroke-linejoin="round" />
  <path d="M290 170 V210 H330" fill="none" stroke="#5eead4" stroke-width="6" stroke-linejoin="round" />

  <!-- Document horizontal lines -->
  <line x1="216" y1="230" x2="274" y2="230" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
  <line x1="216" y1="260" x2="300" y2="260" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
  <line x1="216" y1="290" x2="280" y2="290" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />

  <!-- Vault Keyhole / Expiry Clock Symbol Badge -->
  <circle cx="256" cy="365" r="32" fill="#0d9488" stroke="#ffffff" stroke-width="6" />
  <!-- Clock hands inside badge -->
  <polyline points="256,349 256,365 268,365" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
